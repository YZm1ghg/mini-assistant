# JVM 参数 —— 构建时给够内存
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# 用 AndroidX
android.useAndroidX=true

# 关掉 jetifier（新项目不需要）
android.enableJetifier=false


# ⚠⚠ 这个开关必须开（踩过）
#
#   Android 的构建工具在很多地方假设路径是纯 ASCII。
#   项目放在中文目录里时 gradle 会直接拒绝：
#     "Your project path contains non-ASCII characters"
#
#   下面这行就是官方给的解决办法 —— 开了之后中文路径能正常构建。
#   （实测 Windows + Gradle 8.14 + AGP 8.5 没问题）
android.overridePathCheck=true

# ⚠⚠ 关掉「把 git 信息打进 APK」的功能
#
#   默认情况下 AGP 会把构建时的 VCS 信息写进：
#       META-INF/version-control-info.textproto
#   里面可能有仓库路径、分支名、commit hash。
#
#   本机实测这个文件是 NO_SUPPORTED_VCS_FOUND（因为
#   mobile/ 不是独立仓库），但**不能依赖运气** ——
#   用户如果把它放进 git 仓库构建，就会带上仓库信息。
#
#   ✅ 直接关掉，别让它写。

