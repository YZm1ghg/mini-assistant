<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>迷你助手 · 手表</title>
<!--
  手表版

  屏幕很小（一般 300~450px 宽，圆形表盘可视区更小），
  所以跟手机版**差别很大**：

    · 不要顶栏 —— 省那一行空间
    · 消息区占满 —— 表上不该有"输入框占半屏"
    · **主界面就是一个大麦克风** —— 说话是手表最主要的交互
    · 键盘输入藏在二级 —— 表上打字很痛苦
    · 圆表要留边距（⌚ 圆形屏幕四个角会被切掉）

  仍然共用 app.js —— 只是 UI 换了一套。
-->
<link rel="stylesheet" href="style.css">
<style>
  /* ============================================================
     手表专用布局
     ============================================================ */

  body {
    font-size: 13px;
    background: #0f0f0f;
  }

  /* ---- 顶栏极简：只有状态点 ---- */
  header {
    padding: calc(var(--safe-t) + 4px) 12px 4px;
    border-bottom: none;
    background: none;
    justify-content: center;
  }
  header #title { display: none; }
  header .icon { display: none; }

  #dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--fg-mute);
    margin: 2px auto;
  }
  #dot.on  { background: var(--accent); }
  #dot.off { background: var(--danger); }

  /* ---- 消息区：占满剩余空间 ---- */
  main {
    padding: 6px 0 4px;
    text-align: center;
  }
  .wrap { padding: 0 18px; }
  .msg { margin-bottom: 12px; }
  .who { display: none; }              /* 表上不标"我/助手" */
  .msg.me .body {
    background: none;                   /* 不要气泡，省空间 */
    padding: 0;
    color: var(--fg-dim);
    font-size: 12px;
  }
  .body { font-size: 13.5px; line-height: 1.5; }
  .meta { display: none; }
  .empty { padding: 20px 10px; }
  .empty .logo {
    width: 40px; height: 40px; font-size: 17px;
    margin-bottom: 10px;
  }
  .empty p { font-size: 12px; }

  /* ---- 底部：一个大麦克风 ---- */
  footer {
    border-top: none;
    background: none;
    padding: 4px 12px calc(var(--safe-b) + 10px);
  }
  .input-row {
    justify-content: center;
    align-items: center;
    gap: 12px;
  }
  textarea { display: none; }           /* 键盘输入藏在二级 */
  #micBtn {
    width: 62px; height: 62px;
    border-radius: 50%;
    background: var(--bg-3);
    border: 1px solid var(--line);
    color: var(--fg);
    flex: 0 0 auto;
  }
  #micBtn svg { width: 26px; height: 26px; }
  #micBtn.rec {
    background: var(--danger);
    border-color: var(--danger);
    color: #fff;
  }
  #micBtn.busy {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .send { display: none; }

  .status {
    font-size: 10.5px;
    min-height: 13px;
    margin-top: 4px;
  }

  /* ---- 打字模式（点了键盘按钮才有）---- */
  body.typing textarea { display: block; }
  body.typing #micBtn { width: 42px; height: 42px; }
  body.typing #micBtn svg { width: 18px; height: 18px; }
  body.typing .send { display: flex; }

  /* ---- 键盘切换按钮 ---- */
  #kbBtn {
    position: fixed;
    right: 10px;
    top: calc(var(--safe-t) + 34px);
    width: 30px; height: 30px;
    padding: 0;
    border-radius: 50%;
    background: none;
    border: none;
    color: var(--fg-mute);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ---- 圆形表盘：内容别贴边 ---- */
  @media (max-width: 400px) {
    .wrap { padding: 0 26px; }
    main { padding: 2px 0; }
  }
</style>
</head>
<body>

<!-- ==================== 首次配置 ==================== -->
<div id="setup" class="overlay show">
  <div class="setup-box" style="padding:20px 18px;">
    <h1 style="font-size:19px;">迷你助手</h1>
    <p class="muted" style="font-size:12px;margin-bottom:16px;">
      填一下电脑的地址
    </p>

    <input id="s-host" type="text" inputmode="url"
           placeholder="IP:端口"
           autocomplete="off" autocapitalize="off"
           spellcheck="false" style="font-size:14px;padding:9px 11px;">

    <div class="row" style="margin-top:12px;">
      <button class="ghost" style="padding:9px;font-size:12px"
              onclick="scan()">搜索</button>
      <button class="pri" style="padding:9px;font-size:12px"
              onclick="saveSetup()">连接</button>
    </div>
    <div id="s-err" class="err" style="font-size:11px"></div>
  </div>
</div>

<!-- ==================== 主界面 ==================== -->
<div id="app" class="hidden">
  <header>
    <div id="dot"></div>
  </header>

  <main id="list">
    <div class="wrap" id="msgs">
      <div class="empty">
        <div class="logo">D</div>
        <p>点一下麦克风<br>跟我说话</p>
      </div>
    </div>
  </main>

  <footer>
    <div class="input-row">
      <button class="icon mic" id="micBtn" onclick="record()">
        <svg viewBox="0 0 24 24">
          <path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"
                fill="currentColor"/>
          <path d="M5 11a7 7 0 0 0 14 0M12 18v4"
                stroke="currentColor" stroke-width="2"
                stroke-linecap="round" fill="none"/>
        </svg>
      </button>
      <textarea id="in" rows="1" placeholder="打字…"></textarea>
      <button class="icon send" onclick="send()">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path d="M4 12l16-8-6 8 6 8z" fill="currentColor"/>
        </svg>
      </button>
    </div>
    <div class="status" id="status"></div>
  </footer>

  <button id="kbBtn" onclick="toggleTyping()" title="打字">
    <svg viewBox="0 0 24 24" width="16" height="16">
      <rect x="2" y="6" width="20" height="12" rx="2"
            stroke="currentColor" stroke-width="1.5" fill="none"/>
      <path d="M6 10h1M10 10h1M14 10h1M18 10h1M7 14h10"
            stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round"/>
    </svg>
  </button>
</div>

<div id="toast"></div>

<script src="app.js"></script>
<script>
  // ---- 打字模式切换 ----
  function toggleTyping() {
    var on = document.body.classList.toggle('typing');
    if (on) {
      var el = document.getElementById('in');
      el.focus();
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 60) + 'px';
    }
  }

  // ---- 手表上状态点代替文字 ----
  (function () {
    var oldStatus = window.setStatus;
    window.setStatus = function (s) {
      if (oldStatus) oldStatus(s);
      var d = document.getElementById('dot');
      if (!d) return;
      d.classList.remove('on', 'off');
      if (!s) return;
      if (/连不上|不可用|失败/.test(s)) d.classList.add('off');
      else if (/已连接/.test(s)) d.classList.add('on');
    };
  })();

  // ---- 表上不需要长历史，只显示最近 6 条 ----
  (function () {
    var oldRender = window.render;
    window.render = function (list) {
      if (oldRender) oldRender((list || []).slice(-6));
    };
  })();
</script>
</body>
</html>
